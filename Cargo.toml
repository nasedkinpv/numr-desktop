[package]
name = "numr-desktop"
version = "0.9.2"
description = "Desktop app for the numr text calculator"
authors = ["nasedkinpv"]
license = "MIT"
repository = "https://github.com/nasedkinpv/numr-desktop"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
directories = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
